[project]
name = "lichess-mcp"
version = "1.1.0"
description = "Connect Lichess to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Lichess API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["lichess", "lichess api", "lichess mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/lichess-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=lichess"
Source = "https://github.com/cotlet-connect/lichess-mcp"

[project.scripts]
lichess-mcp = "lichess_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"lichess_agent.py" = "lichess_agent.py"

[tool.hatch.build.targets.sdist]
include = ["lichess_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
